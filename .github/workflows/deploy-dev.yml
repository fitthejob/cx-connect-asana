name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install & build asana-ticket
        working-directory: modules/lambda-asana-ticket/src
        run: |
          npm ci
          npm run build

      - name: Zip asana-ticket
        working-directory: modules/lambda-asana-ticket/src/dist
        run: zip -r ../asana-ticket.zip .

      - name: Upload asana-ticket artifact
        working-directory: modules/lambda-asana-ticket/src
        run: |
          aws s3 cp asana-ticket.zip \
            s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/asana-ticket/dev/asana-ticket-${{ github.sha }}.zip

      - name: Install & build recording-transcribe
        working-directory: modules/lambda-recording-transcribe/src
        run: |
          npm ci
          npm run build

      - name: Zip recording-transcribe
        working-directory: modules/lambda-recording-transcribe/src/dist
        run: zip -r ../recording-transcribe.zip .

      - name: Upload recording-transcribe artifact
        working-directory: modules/lambda-recording-transcribe/src
        run: |
          aws s3 cp recording-transcribe.zip \
            s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/recording-transcribe/dev/recording-transcribe-${{ github.sha }}.zip

      - name: Install & build transcript-update
        working-directory: modules/lambda-asana-transcript-update/src
        run: |
          npm ci
          npm run build

      - name: Zip transcript-update
        working-directory: modules/lambda-asana-transcript-update/src/dist
        run: zip -r ../transcript-update.zip .

      - name: Upload transcript-update artifact
        working-directory: modules/lambda-asana-transcript-update/src
        run: |
          aws s3 cp transcript-update.zip \
            s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/transcript-update/dev/transcript-update-${{ github.sha }}.zip

  deploy-dev:
    needs: build-artifact
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (Lambda + validation sandbox only)
        run: |
          terraform apply -auto-approve \
            -target=module.lambda_asana_ticket \
            -target=module.asana_flow_module.aws_connect_contact_flow_module.validation_sandbox \
            -var="environment=dev" \
            -var="asana_ticket_function_name=asana-ticket-dev" \
            -var="s3_bucket_lambda_artifacts=${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="artifact_sha=${{ github.sha }}" \
            -var="asana_project_gid=${{ vars.ASANA_PROJECT_GID }}" \
            -var="contact_correlation_table_name=contact-correlation-dev" \
            -var="recording_transcribe_function_name=asana-recording-transcribe-dev" \
            -var="recording_bucket_name=${{ vars.RECORDING_BUCKET_NAME }}" \
            -var="transcript_update_function_name=asana-transcript-update-dev"

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          echo "asana_ticket_alias_arn=$(terraform output -raw asana_ticket_alias_arn)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw connect_instance_id)" >> "$GITHUB_OUTPUT"
          echo "validation_sandbox_module_id=$(terraform output -raw validation_sandbox_module_id)" >> "$GITHUB_OUTPUT"

      - name: Generate Asana flow module JSON
        run: npm run generate:asana-integration-flow
        env:
          ASANA_TICKET_LAMBDA_ARN: ${{ steps.tf-outputs.outputs.asana_ticket_alias_arn }}

      - name: Validate flow module against sandbox
        run: |
          aws connect update-contact-flow-module-content \
            --instance-id "${{ steps.tf-outputs.outputs.instance_id }}" \
            --contact-flow-module-id "${{ steps.tf-outputs.outputs.validation_sandbox_module_id }}" \
            --content file://modules/asana-flow-module/contact_flows/asana_integration.json

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="asana_ticket_function_name=asana-ticket-dev" \
            -var="s3_bucket_lambda_artifacts=${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="artifact_sha=${{ github.sha }}" \
            -var="asana_project_gid=${{ vars.ASANA_PROJECT_GID }}" \
            -var="contact_correlation_table_name=contact-correlation-dev" \
            -var="recording_transcribe_function_name=asana-recording-transcribe-dev" \
            -var="recording_bucket_name=${{ vars.RECORDING_BUCKET_NAME }}" \
            -var="transcript_update_function_name=asana-transcript-update-dev"
